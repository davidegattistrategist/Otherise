# Backup notturno dei dati (vedi docs/BACKUP.md).
# Ogni notte copia il database, la ricarica su un database vuoto per verificare
# che sia completa, la cifra e la conserva qui su GitHub per 30 giorni.
# Se qualcosa va storto GitHub manda un'email a chi gestisce il repository.
# Senza i segreti BACKUP_DATABASE_URL e BACKUP_PASSPHRASE non fa nulla.
name: Backup notturno

on:
  schedule:
    - cron: "17 2 * * *" # 4:17 in Italia (3:17 con l'ora solare)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      prova:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: prova
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SOURCE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Backup configurato?
        id: check
        run: |
          if [ -z "$SOURCE_URL" ]; then
            echo "Backup non configurato (manca il segreto BACKUP_DATABASE_URL): niente da fare."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          elif [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "Manca il segreto BACKUP_PASSPHRASE: senza, la copia non sarebbe cifrata."
            exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != '1'

      - name: Strumenti di Postgres 17
        if: steps.check.outputs.skip != '1'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 > /dev/null
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Copia e prova di ripristino
        if: steps.check.outputs.skip != '1'
        env:
          TARGET_URL: postgresql://postgres:prova@localhost:5432/postgres
          OUT_DIR: backup-out
        run: ./scripts/backup/backup.sh

      - name: Conserva la copia cifrata (30 giorni)
        if: steps.check.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_number }}
          path: backup-out/*.gpg
          retention-days: 30
          if-no-files-found: error
